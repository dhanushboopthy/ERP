services:

  # ── MySQL 8.0 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: SudhanTextileERP
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Only bind to localhost — access the DB via SSH tunnel from your workstation.
    # Remove this port mapping entirely if you don't need direct DB admin access.
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ASP.NET Core 10 Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/SudhanTextileERP.API
      dockerfile: Dockerfile
    image: dhanushboopathy/erp-backend:latest
    container_name: erp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      # ── Required secrets (filled from .env file) ───────────────────────────
      DB_CONNECTION_STRING: "Server=mysql;Port=3306;Database=SudhanTextileERP;Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};SslMode=None;AllowUserVariables=True;AllowPublicKeyRetrieval=True;ConnectionTimeout=60;"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # ── Override production HTTPS requirement (nginx handles TLS) ──────────
      Security__RequireHttps: "false"
      # ── Optional email alerts ──────────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
    volumes:
      - backups:/var/backups/sudhantextile
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Next.js 14 Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — must be the public-facing URL
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: dhanushboopathy/erp-frontend:latest
    container_name: erp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-network
  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - erp-network

# ── Persistent volumes ──────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  backups:
    driver: local

# ── Internal network (services are not exposed unless mapped above) ─────────────
networks:
  erp-network:
    driver: bridge
